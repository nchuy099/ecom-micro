input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  udp {
    port => 5000
    codec => json
  }
}

filter {
  if [message] and [message] =~ /^\s*[\[{]/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  if [app_name] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "%{app_name}-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "unknown-service-logs-%{+YYYY.MM.dd}"
    }
  }

  stdout { codec => rubydebug }
}
