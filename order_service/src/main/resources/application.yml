server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_micro_orders
    username: root
    password: password

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: order-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer #org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        #        spring.json.value.default.type: com.nchuy099.ecom_micro_product_service.consumers.dto.Order
        spring.json.trusted.packages: "*"

logging:
  level:
    org.springframework.cloud.loadbalancer.core.RoundRobinLoadBalancer: DEBUG