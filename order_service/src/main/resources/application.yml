server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: ${SAGA_QUARTZ_CHECKIN_MS:10000}
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  sql:
    init:
      mode: always
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_micro_orders
    username: root
    password: password

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: order-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer #org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        #        spring.json.value.default.type: com.nchuy099.ecom_micro_product_service.consumers.dto.Order
        spring.json.trusted.packages: "*"

logging:
  level:
    org.springframework.cloud.loadbalancer.core.RoundRobinLoadBalancer: DEBUG

saga:
  outbox:
    retry-interval-ms: ${SAGA_OUTBOX_RETRY_INTERVAL_MS:10000}
    batch-size: ${SAGA_OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${SAGA_OUTBOX_SEND_TIMEOUT_MS:30000}
