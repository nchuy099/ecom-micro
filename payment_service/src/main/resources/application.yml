server:
  port: 8890
spring:
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: ${SAGA_QUARTZ_CHECKIN_MS:10000}
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  sql:
    init:
      mode: always
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/ecom_micro_payments}
    username: ${PAYMENT_DB_USER:root}
    password: ${PAYMENT_DB_PASSWORD:password}
  application:
    name: payment-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
saga:
  payment:
    fail: false

saga:
  outbox:
    retry-interval-ms: ${SAGA_OUTBOX_RETRY_INTERVAL_MS:10000}
    batch-size: ${SAGA_OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${SAGA_OUTBOX_SEND_TIMEOUT_MS:30000}
