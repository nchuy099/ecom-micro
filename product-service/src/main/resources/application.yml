spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/product_service}
    username: ${PRODUCT_DB_USERNAME:ecom}
    password: ${PRODUCT_DB_PASSWORD:ecom}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

ecommerce:
  search:
    backend: ${PRODUCT_SEARCH_BACKEND:elasticsearch}
    index-alias: ${PRODUCT_SEARCH_INDEX_ALIAS:products}
    reindex-batch-size: ${PRODUCT_SEARCH_REINDEX_BATCH_SIZE:250}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
