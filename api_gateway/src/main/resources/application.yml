server:
  port: 8282

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecom-micro
          jwk-set-uri: http://localhost:8080/realms/ecom-micro/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/v1/orders/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/v1/products/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: info

order:
  rate-limit:
    capacity: ${ORDER_RATE_LIMIT_CAPACITY:10}
    refill-ms: ${ORDER_RATE_LIMIT_REFILL_MS:6000}
