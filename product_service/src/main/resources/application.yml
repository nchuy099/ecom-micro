server:
  port: 8888


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: ${SAGA_QUARTZ_CHECKIN_MS:10000}
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  sql:
    init:
      mode: always
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_micro_products
    username: root
    password: password

  data:
    redis:
      host: localhost
      port: 6380

  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer #org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
#        spring.json.value.default.type: com.nchuy099.ecom_micro_product_service.consumers.dto.Order
        spring.json.trusted.packages: "*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG

saga:
  outbox:
    retry-interval-ms: ${SAGA_OUTBOX_RETRY_INTERVAL_MS:10000}
    batch-size: ${SAGA_OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${SAGA_OUTBOX_SEND_TIMEOUT_MS:30000}
