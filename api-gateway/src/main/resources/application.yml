server:
  port: 8282

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/ecom}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: keycloak-login
              uri: ${KEYCLOAK_BASE_URL:http://localhost:8090}
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/auth/login
                    replacement: "/realms/ecom/protocol/openid-connect/token"
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/users(?<segment>/?.*)
                    replacement: "/v1/users$\\{segment}"
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/products(?<segment>/?.*)
                    replacement: "/v1/products$\\{segment}"
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/orders(?<segment>/?.*)
                    replacement: "/v1/orders$\\{segment}"
            - id: flashsale-service
              uri: lb://order-service
              predicates:
                - Path=/api/flashsale/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/flashsale(?<segment>/?.*)
                    replacement: "/v1/flashsale$\\{segment}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

rate-limit:
  login:
    enabled: true
    capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
    refill-period: ${LOGIN_RATE_LIMIT_REFILL_PERIOD:15m}
  orders:
    enabled: true
    capacity: ${ORDER_RATE_LIMIT_CAPACITY:10}
    refill-period: ${ORDER_RATE_LIMIT_REFILL_PERIOD:1s}
  flash-sale:
    enabled: true
    capacity: ${FLASHSALE_RATE_LIMIT_CAPACITY:5}
    refill-period: ${FLASHSALE_RATE_LIMIT_REFILL_PERIOD:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
